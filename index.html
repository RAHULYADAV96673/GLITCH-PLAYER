<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLITCH OS</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/reset.css?v=10">
  <link rel="stylesheet" href="css/ui.css?v=10">
  <link rel="stylesheet" href="css/desktop.css?v=10">
  <link rel="stylesheet" href="css/window.css?v=10">
  <link rel="stylesheet" href="css/dock.css?v=10">
  <link rel="stylesheet" href="css/taskbar.css?v=10">
  <link rel="stylesheet" href="css/startmenu.css?v=10">
  <link rel="stylesheet" href="css/quicksettings.css?v=10">
  <link rel="stylesheet" href="css/apps.css?v=10">
  <link rel="stylesheet" href="css/webos.css?v=10">
</head>

<body>
  <div id="wallpaper-layer"></div>
  <video id="wallpaper-video" muted loop playsinline></video>
  <div id="wallpaper-overlay"></div>

  <main id="desktop">
    <div id="dynamic-island">GLITCH OS ready</div>

    <section id="desktop-clock" class="desktop-clock mond-clock">
  <div id="clock-day">MONDAY</div>
  <div id="clock-date">03 SEPTEMBER, 2018.</div>
  <div id="clock-time">- 20:54 -</div>
</section>

    <section id="desktop-icons" class="desktop-icons"></section>
    <section id="window-layer" class="window-layer"></section>

    <section id="start-menu" class="start-menu hidden">
      <div class="start-menu-header">
        <div>
          <h2>GLITCH OS</h2>
          <p>Apps, files, settings and tools</p>
        </div>
        <button id="start-close" class="ghost-button">×</button>
      </div>

      <div class="start-search">
        <input id="start-search-input" placeholder="Search apps">
      </div>

      <div id="start-apps" class="start-apps"></div>

      <div class="start-footer">
        <button data-power="Sleep">Sleep</button>
        <button data-power="Restart">Restart</button>
        <button data-power="Shut Down">Shut Down</button>
      </div>
    </section>

    <section id="quick-settings" class="quick-settings hidden">
      <div class="quick-settings-header">
        <strong>Quick Settings</strong>
        <span id="quick-status-text">Online</span>
      </div>

      <div class="quick-toggle-grid">
        <button id="wifi-toggle">Wi-Fi</button>
        <button id="bluetooth-toggle">Bluetooth</button>
        <button id="theme-toggle">Theme</button>
        <button id="live-wallpaper-toggle">Live</button>
      </div>

      <label class="slider-row">
        <span>Volume</span>
        <input id="volume-slider" type="range" min="0" max="100">
      </label>

      <label class="slider-row">
        <span>Brightness</span>
        <input id="brightness-slider" type="range" min="45" max="110">
      </label>

      <div id="quick-now-playing" class="quick-now-playing">Nothing playing</div>
    </section>

    <section id="taskbar" class="taskbar">
      <button id="start-button" class="start-button">◆</button>

      <div class="taskbar-search-box">
        <input id="taskbar-search" placeholder="Search apps">
      </div>

      <div id="running-apps" class="running-apps"></div>

      <button id="system-tray" class="system-tray">
        <span id="tray-wifi">Wi-Fi</span>
        <span id="tray-battery">87%</span>
        <span id="tray-volume">Vol</span>
        <span id="tray-time">00:00</span>
      </button>
    </section>

    <section id="dock" class="dock"></section>
  </main>

<script src="js/core/state.js?v=23"></script>
<script src="js/core/dynamicisland.js?v=23"></script>
<script src="js/core/wallpapers.js?v=23"></script>
<script src="js/core/clock.js?v=23"></script>
<script src="js/core/desktopicons.js?v=23"></script>

<script src="js/apps/settings.js?v=23"></script>
<script src="js/apps/terminal.js?v=23"></script>
<script src="js/apps/files.js?v=23"></script>
<script src="js/apps/calculator.js?v=23"></script>
<script src="js/apps/clockapp.js?v=23"></script>
<script src="js/apps/weather.js?v=23"></script>
<script src="js/apps/calendar.js?v=23"></script>
<script src="js/apps/draw.js?v=23"></script>

<script src="js/apps/notes.js"></script>

<script src="js/core/windowmanager.js?v=23"></script>
<script src="js/core/dock.js?v=23"></script>
<script src="js/core/startmenu.js?v=23"></script>
<script src="js/core/quicksettings.js?v=23"></script>
<script src="js/core/boot.js?v=23"></script>
<script src="js/webos.js?v=23"></script>
</body>
</html>
