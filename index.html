 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/reset.css"/>
  <link rel="stylesheet" href="css/desktop.css"/>
  <link rel="stylesheet" href="css/dock.css"/>
  <link rel="stylesheet" href="css/window.css"/>
  <link rel="stylesheet" href="css/apps.css"/>
  <link rel="stylesheet" href="css/ui.css"/>
</head>
<body>

  <div id="boot-screen">
    <div class="boot-logo">💻</div>
    <div class="boot-name">WebOS</div>
    <div class="boot-bar"><div class="boot-progress"></div></div>
  </div>

  <div id="desktop">

    <div class="desktop-icons">
      <div class="desktop-icon" ondblclick="openApp('explorer')">
        <div class="icon-emoji">📁</div><span>Files</span>
      </div>
      <div class="desktop-icon" ondblclick="openApp('notepad')">
        <div class="icon-emoji">📝</div><span>Notepad</span>
      </div>
      <div class="desktop-icon" ondblclick="openApp('calc')">
        <div class="icon-emoji">🧮</div><span>Calculator</span>
      </div>
      <div class="desktop-icon" ondblclick="openApp('settings')">
        <div class="icon-emoji">⚙️</div><span>Settings</span>
      </div>
      <div class="desktop-icon" ondblclick="openApp('about')">
        <div class="icon-emoji">ℹ️</div><span>About</span>
      </div>
    </div>

    <div id="desktop-clock">
      <div id="desk-time">
        <span id="desk-hours">00</span><span class="desk-colon">:</span><span id="desk-minutes">00</span><span class="desk-ampm" id="desk-ampm">AM</span>
      </div>
      <div id="desk-date"></div>
      <div id="desk-seconds-bar"><div id="desk-seconds-fill"></div></div>
    </div>

  </div>

  <div id="menubar">
    <span class="menubar-apple">⌘</span>
    <span class="menubar-item menubar-bold" id="menubar-appname">Finder</span>
    <span class="menubar-item">File</span>
    <span class="menubar-item">Edit</span>
    <span class="menubar-item">View</span>
    <div class="menubar-right">
      <span id="menubar-clock"></span>
    </div>
  </div>

  <div id="dock-container">
    <div id="dock">
      <div class="dock-item" data-app="explorer" onclick="openApp('explorer')" id="dock-explorer">
        <div class="dock-icon-wrap"><span>📁</span></div>
        <span class="dock-label">Files</span>
        <div class="dock-dot" id="dot-explorer"></div>
      </div>
      <div class="dock-item" data-app="notepad" onclick="openApp('notepad')" id="dock-notepad">
        <div class="dock-icon-wrap"><span>📝</span></div>
        <span class="dock-label">Notepad</span>
        <div class="dock-dot" id="dot-notepad"></div>
      </div>
      <div class="dock-item" data-app="calc" onclick="openApp('calc')" id="dock-calc">
        <div class="dock-icon-wrap"><span>🧮</span></div>
        <span class="dock-label">Calculator</span>
        <div class="dock-dot" id="dot-calc"></div>
      </div>
      <div class="dock-item" data-app="settings" onclick="openApp('settings')" id="dock-settings">
        <div class="dock-icon-wrap"><span>⚙️</span></div>
        <span class="dock-label">Settings</span>
        <div class="dock-dot" id="dot-settings"></div>
      </div>
      <div class="dock-divider"></div>
      <div class="dock-item" data-app="about" onclick="openApp('about')" id="dock-about">
        <div class="dock-icon-wrap"><span>ℹ️</span></div>
        <span class="dock-label">About</span>
        <div class="dock-dot" id="dot-about"></div>
      </div>
    </div>
  </div>

  <div id="context-menu">
    <div class="ctx-item" onclick="cycleWallpaper()">🖼️ Change Wallpaper</div>
    <div class="ctx-item" onclick="openApp('settings')">⚙️ Settings</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="openApp('about')">ℹ️ About WebOS</div>
  </div>

  <div id="notification">
    <div id="notif-icon">💻</div>
    <div id="notif-text">
      <div id="notif-title">WebOS</div>
      <div id="notif-body">Welcome! Right-click desktop for options.</div>
    </div>
  </div>

  <script src="js/core/wallpapers.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/core/notification.js"></script>
  <script src="js/core/contextmenu.js"></script>
  <script src="js/core/windowmanager.js"></script>
  <script src="js/core/dock.js"></script>
  <script src="js/apps/explorer.js"></script>
  <script src="js/apps/notepad.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/about.js"></script>
  <script src="js/core/boot.js"></script>
</body>
</html>
